name: Export All Assets
on: [push, workflow_dispatch]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:nightly
      options: --user root
    
    steps:
      - uses: actions/checkout@v4

      - name: install libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends kicad-packages3d

      - name: prep directories
        run: mkdir -p export/3d export/schematic export/layers

      - name: 3d
        env:
          KICAD9_3DMODEL_DIR: /usr/share/kicad/3dmodels/
        run: >
          kicad-cli pcb export glb 
          --subst-models 
          --include-tracks 
          --include-zones 
          --include-pads 
          --include-soldermask 
          --include-silkscreen 
          --user-origin
          -o export/3d/RPi-HwAB.glb 
          pcb/RPi-HwAB-1.kicad_pcb

      - name: schematics
        run: >
          kicad-cli sch export pdf 
          -o export/schematic/RPi-HwAB.pdf 
          pcb/RPi-HwAB-1.kicad_sch

      - name: layout
        run: |
          kicad-cli pcb export svg --page-size-mode=2 --exclude-drawing-sheet --layers=F.Cu   -o export/layers/L1.svg pcb/RPi-HwAB-1.kicad_pcb
          kicad-cli pcb export svg --page-size-mode=2 --exclude-drawing-sheet --layers=In1.Cu -o export/layers/L2.svg pcb/RPi-HwAB-1.kicad_pcb
          kicad-cli pcb export svg --page-size-mode=2 --exclude-drawing-sheet --layers=In2.Cu -o export/layers/L3.svg pcb/RPi-HwAB-1.kicad_pcb
          kicad-cli pcb export svg --page-size-mode=2 --exclude-drawing-sheet --layers=In3.Cu -o export/layers/L4.svg pcb/RPi-HwAB-1.kicad_pcb
          kicad-cli pcb export svg --page-size-mode=2 --exclude-drawing-sheet --layers=In4.Cu -o export/layers/L5.svg pcb/RPi-HwAB-1.kicad_pcb
          kicad-cli pcb export svg --page-size-mode=2 --exclude-drawing-sheet --layers=In5.Cu -o export/layers/L6.svg pcb/RPi-HwAB-1.kicad_pcb
          kicad-cli pcb export svg --page-size-mode=2 --exclude-drawing-sheet --layers=In6.Cu -o export/layers/L7.svg pcb/RPi-HwAB-1.kicad_pcb
          kicad-cli pcb export svg --page-size-mode=2 --exclude-drawing-sheet --layers=B.Cu   -o export/layers/L8.svg pcb/RPi-HwAB-1.kicad_pcb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-assets
          path: export