name: Export 3D Model
on: [push, workflow_dispatch]

jobs:
  export:
    runs-on: ubuntu-latest
    # This line runs the entire job INSIDE the KiCad Nightly container
    container: ghcr.io/inti-cmnb/kicad_auto:nightly
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run KiBot
        # Now we can just type the command like a normal human
        run: kibot -c kibot.yaml -b pcb/RPi-HwAB-1.kicad_pcb -e pcb/RPi-HwAB-1.kicad_sch -d 3d_models -i

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STEP-File
          path: 3d_models
