name: Export 3D Model
on: [push, workflow_dispatch]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:nightly
      options: --user root
    
    steps:
      - uses: actions/checkout@v4

      - name: Install 3D Libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends kicad-nightly-packages3d

      - name: Prepare Output Directory
        run: mkdir -p 3d_models

      - name: Export STEP
        # --include-tracks: Copper traces
        # --include-zones:  Copper fills/planes
        # --fill-all-vias:  Solid vias (no holes)
        run: kicad-cli pcb export step --subst-models --include-tracks --include-zones --include-pads --fill-all-vias -o 3d_models/RPi-HwAB.step pcb/RPi-HwAB-1.kicad_pcb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STEP-File
          path: 3d_models