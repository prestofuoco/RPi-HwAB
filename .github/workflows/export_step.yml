name: Export 3D Model
on: [push, workflow_dispatch]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:nightly
      # THIS IS THE FIX: Force the container to run as Admin/Root
      options: --user root
    
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Output Directory
        run: mkdir -p 3d_models

      - name: Export STEP
        # In the official image, the command is 'kicad-cli'
        run: kicad-cli pcb export step --subst-models -o 3d_models/RPi-HwAB.step pcb/RPi-HwAB-1.kicad_pcb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STEP-File
          path: 3d_models