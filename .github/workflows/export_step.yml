name: Export 3D Model
on: [push, workflow_dispatch]

jobs:
  export:
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad_auto:nightly
    
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Output Directory
        run: mkdir -p 3d_models

      - name: Check KiCad Version
        # This confirms we have the right tool before running the big command
        run: |
          which kicad-cli-nightly
          kicad-cli-nightly --version

      - name: Raw Step Export
        # Updated command name: kicad-cli -> kicad-cli-nightly
        run: kicad-cli-nightly pcb export step --subst-models -o 3d_models/RPi-HwAB.step pcb/RPi-HwAB-1.kicad_pcb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STEP-File
          path: 3d_models
